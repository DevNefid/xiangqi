<!DOCTYPE html>
<html>
<head><title>象棋</title></head>
<body>
    Index.html
    <script>
        async function test() {
            try {
                const response = await fetch('/api/test');
                const data = await response.json();
                console.log('Data:', data);
                return data;
            } catch (error) {
                console.error('Error fetching board:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            test()
        })
    </script>
</body>
</html>
