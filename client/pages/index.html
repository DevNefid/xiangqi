<!DOCTYPE html>
<html>
<head><title>象棋</title></head>
<body>
    Index.html
    <button id='createSession'>創建房間</button>
    <script>
        /*document.addEventListener('DOMContentLoaded', async () => {
            
        })*/

        document.getElementById('createSession').addEventListener('click', async function() {
            const res = await fetch('/api/create-session', {method: 'POST', headers: { 'Content-Type': 'application/json' }})
            if (!res.ok) {
                console.error('Error: failed to create session')
                return
            }
            
            const data = await res.json()
            const url = new URL('https://xiangqi1.vercel.app/session')
            url.searchParams.set('session-id', data.session_id)
            url.searchParams.set('player-id', data.host_id)
            window.history.pushState({}, '', url)
        })
    </script>
</body>
</html>
