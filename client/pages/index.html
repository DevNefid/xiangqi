<!DOCTYPE html>
<html>
<head><title>象棋</title></head>
<body>
    Index.html
    <button id='createSession'>創建房間</button>
    <script src="../shared/scripts/startup.js"></script>
    <script>
        document.getElementById('createSession').addEventListener('click', async function() {
            const res = await fetch('/api/create-session', { method: 'POST', headers: { 'Content-Type': 'application/json' }})
            if (!res.ok) {
                console.error('Error: failed to create session')
                return
            }
            
            const data = await res.json()
            localStorage.setItem('session-id', data.session_id)
            localStorage.setItem('player-id', data.host_id)
            localStorage.setItem('session-enterid', data.session_enterid)

            window.location.href = window.location.origin + '/session'
        })
    </script>
</body>
</html>
